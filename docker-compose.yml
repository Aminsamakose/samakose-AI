# One command for a working stack: docker compose up --build
# Set the secrets in .env first (copy .env.example). Never commit .env.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: samakose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: samakose
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samakose"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgres://samakose:${POSTGRES_PASSWORD}@db:5432/samakose
    command: sh -c "npx tsx src/db/migrate.ts && npx tsx src/db/seed.ts"
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://samakose:${POSTGRES_PASSWORD}@db:5432/samakose
      STORAGE_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: [files:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://samakose:${POSTGRES_PASSWORD}@db:5432/samakose
      STORAGE_DIR: /data/storage
    volumes: [files:/data/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes: { pgdata: {}, files: {} }
